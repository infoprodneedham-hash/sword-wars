<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jedi vs Sith: Starship Duel</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; margin: auto; border: 4px solid #333; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; color: white; text-shadow: 2px 2px #000; pointer-events: none; }
        .health-bar { width: 300px; height: 20px; border: 2px solid #fff; background: #500; }
        .health-fill { height: 100%; background: #f00; transition: width 0.2s; }
        #player-health { background: #0f0; }
        #msg { position: absolute; top: 50%; width: 100%; text-align: center; color: yellow; font-size: 3rem; display: none; }
        #score { position: absolute; top: 60px; width: 100%; text-align: center; color: white; font-size: 1.5rem; }
    </style>
</head>
<body>

<div id="ui">
    <div>JEDI (P1)<div class="health-bar"><div id="player-health" class="health-fill" style="width: 100%;"></div></div></div>
    <div>SITH (CPU)<div class="health-bar"><div id="enemy-health" class="health-fill" style="width: 100%;"></div></div></div>
</div>
<div id="score">Bouts: Player 0 - 0 Computer</div>
<div id="msg">ROUND START</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');
const scoreEl = document.getElementById('score');

canvas.width = 1000;
canvas.height = 500;

// Game State
let gameState = "PLAYING";
let playerWins = 0;
let enemyWins = 0;
const gravity = 0.8;

class Fighter {
    constructor(x, color, isPlayer) {
        this.x = x;
        this.y = 300;
        this.width = 50;
        this.height = 100;
        this.color = color;
        this.hp = 100;
        this.vx = 0;
        this.vy = 0;
        this.isJumping = false;
        this.isPlayer = isPlayer;
        this.attackType = null; // 'swing', 'thrust', 'kick'
        this.attackFrames = 0;
        this.facing = isPlayer ? 1 : -1;
    }

    draw() {
        // Draw Character
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        // Draw Saber
        if (this.attackType) {
            ctx.lineWidth = 5;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.isPlayer ? "cyan" : "red";
            ctx.strokeStyle = "white";
            ctx.beginPath();
            
            if (this.attackType === 'swing') {
                ctx.moveTo(this.x + this.width/2, this.y + 20);
                ctx.lineTo(this.x + this.width/2 + (60 * this.facing), this.y + 80);
            } else if (this.attackType === 'thrust') {
                ctx.moveTo(this.x + this.width/2, this.y + 50);
                ctx.lineTo(this.x + this.width/2 + (80 * this.facing), this.y + 50);
            } else if (this.attackType === 'kick') {
                ctx.fillStyle = "brown";
                ctx.fillRect(this.x + (this.facing === 1 ? this.width : -30), this.y + 70, 30, 15);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
    }

    update() {
        this.y += this.vy;
        this.x += this.vx;
        if (this.y + this.height < canvas.height - 50) this.vy += gravity;
        else { this.vy = 0; this.y = canvas.height - 50 - this.height; this.isJumping = false; }
        
        // Horizontal bounds
        if (this.x < 0) this.x = 0;
        if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;

        if (this.attackFrames > 0) {
            this.attackFrames--;
        } else {
            this.attackType = null;
        }
    }

    attack(type) {
        if (!this.attackType) {
            this.attackType = type;
            this.attackFrames = 15;
        }
    }
}

const p1 = new Fighter(100, 'blue', true);
const cpu = new Fighter(850, 'darkred', false);
let particles = [];

// Input handling
const keys = {};
window.onkeydown = (e) => keys[e.code] = true;
window.onkeyup = (e) => keys[e.code] = false;

function handleInput() {
    if (keys['ArrowLeft']) p1.vx = -5;
    else if (keys['ArrowRight']) p1.vx = 5;
    else p1.vx = 0;

    if (keys['ArrowUp'] && !p1.isJumping) { p1.vy = -15; p1.isJumping = true; }
    if (keys['Space']) p1.attack('swing');
    if (keys['KeyT']) p1.attack('thrust'); // Extra thrust key
    if (keys['ArrowDown']) p1.attack('kick');
}

function cpuAI() {
    const dist = p1.x - cpu.x;
    if (Math.abs(dist) > 100) cpu.vx = dist > 0 ? 2 : -2;
    else {
        cpu.vx = 0;
        if (Math.random() > 0.95) cpu.attack(Math.random() > 0.5 ? 'swing' : 'kick');
    }
}

function checkCollision(a, b) {
    if (a.attackType && a.attackFrames > 10) {
        const reach = a.attackType === 'thrust' ? 80 : 50;
        const hitX = a.facing === 1 ? a.x + a.width : a.x - reach;
        if (hitX + reach > b.x && hitX < b.x + b.width && a.y < b.y + b.height && a.y + a.height > b.y) {
            b.hp -= 2;
            b.x += a.facing * 10; // Knockback
        }
    }
}

function createFireworks() {
    for(let i=0; i<100; i++) {
        particles.push({
            x: canvas.width/2, y: canvas.height/2,
            vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
            color: `hsl(${Math.random()*360}, 100%, 50%)`,
            life: 100
        });
    }
}

function drawBackground() {
    ctx.fillStyle = "#111";
    ctx.fillRect(0,0, canvas.width, canvas.height);
    // Ship walls
    ctx.strokeStyle = "#444";
    for(let i=0; i<canvas.width; i+=100) {
        ctx.strokeRect(i, 0, 100, canvas.height);
    }
    // Floor
    ctx.fillStyle = "#222";
    ctx.fillRect(0, canvas.height-50, canvas.width, 50);
}

function resetRound() {
    p1.hp = 100; cpu.hp = 100;
    p1.x = 100; cpu.x = 850;
    gameState = "PLAYING";
    msgEl.style.display = "none";
}

function gameLoop() {
    drawBackground();

    if (gameState === "PLAYING") {
        handleInput();
        cpuAI();
        p1.update();
        cpu.update();
        checkCollision(p1, cpu);
        checkCollision(cpu, p1);

        if (p1.hp <= 0 || cpu.hp <= 0) {
            gameState = "ROUND_END";
            if (p1.hp > 0) playerWins++; else enemyWins++;
            scoreEl.innerText = `Bouts: Player ${playerWins} - ${enemyWins} Computer`;
            
            if (playerWins === 2 || enemyWins === 2) {
                gameState = "GAME_OVER";
                msgEl.innerText = playerWins === 2 ? "JEDI VICTORIOUS!" : "THE DARK SIDE WINS";
                msgEl.style.display = "block";
                if(playerWins === 2) createFireworks();
            } else {
                msgEl.innerText = "ROUND OVER";
                msgEl.style.display = "block";
                setTimeout(resetRound, 2000);
            }
        }
    }

    p1.draw();
    cpu.draw();

    // Health UI
    document.getElementById('player-health').style.width = p1.hp + "%";
    document.getElementById('enemy-health').style.width = cpu.hp + "%";

    // Fireworks particles
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        if(p.life <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
