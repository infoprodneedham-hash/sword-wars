<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Stick Duel: Best of Three</title>
    <style>
        body { margin: 0; background: #050505; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; margin: auto; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; color: white; pointer-events: none; }
        .health-bar { width: 300px; height: 12px; border: 1px solid #444; background: #222; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .health-fill { height: 100%; transition: width 0.3s ease-out; box-shadow: 0 0 10px currentColor; }
        #score { position: absolute; top: 70px; width: 100%; text-align: center; color: #aaa; font-size: 1.2rem; letter-spacing: 2px; }
        #msg { position: absolute; top: 40%; width: 100%; text-align: center; color: #fff; font-size: 4rem; display: none; font-weight: bold; text-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>

<div id="ui">
    <div>JEDI<div class="health-bar"><div id="p1-hp" class="health-fill" style="width: 100%; color: #0ff; background: #0ff;"></div></div></div>
    <div>SITH<div class="health-bar"><div id="p2-hp" class="health-fill" style="width: 100%; color: #f00; background: #f00;"></div></div></div>
</div>
<div id="score">BOUTS: 0 - 0</div>
<div id="msg">ROUND 1</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');
const scoreEl = document.getElementById('score');

canvas.width = window.innerWidth;
canvas.height = 600;

let p1Wins = 0;
let cpuWins = 0;
let gameState = "PLAYING";
let particles = [];

class Fighter {
    constructor(x, color, isPlayer) {
        this.x = x;
        this.y = 450;
        this.baseY = 450;
        this.color = color;
        this.isPlayer = isPlayer;
        this.hp = 100;
        this.vx = 0;
        this.vy = 0;
        this.facing = isPlayer ? 1 : -1;
        this.attackType = null;
        this.timer = 0;
        this.history = []; // For sword trails
    }

    draw() {
        const headY = this.y - 80;
        const bodyY = this.y - 40;
        
        ctx.strokeStyle = "white";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";

        // Head
        ctx.beginPath();
        ctx.arc(this.x, headY, 10, 0, Math.PI * 2);
        ctx.stroke();

        // Spine
        ctx.beginPath();
        ctx.moveTo(this.x, headY + 10);
        ctx.lineTo(this.x, this.y - 20);
        ctx.stroke();

        // Legs (simple animation)
        const walkCycle = Math.sin(Date.now() * 0.01) * 10 * (this.vx !== 0 ? 1 : 0);
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 20);
        ctx.lineTo(this.x - 15 + walkCycle, this.y); // Left Leg
        ctx.moveTo(this.x, this.y - 20);
        ctx.lineTo(this.x + 15 - walkCycle, this.y); // Right Leg
        ctx.stroke();

        // Sword Logic
        let swordEnd = { x: this.x + 40 * this.facing, y: bodyY };
        
        if (this.attackType === 'swing') {
            const angle = (this.timer / 20) * Math.PI - (Math.PI/2);
            swordEnd.x = this.x + Math.cos(angle * this.facing) * 70 * this.facing;
            swordEnd.y = bodyY + Math.sin(angle) * 70;
        } else if (this.attackType === 'thrust') {
            swordEnd.x = this.x + (70 + (20 - this.timer) * 2) * this.facing;
            swordEnd.y = bodyY;
        } else if (this.attackType === 'kick') {
            ctx.strokeStyle = "white";
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - 20);
            ctx.lineTo(this.x + 40 * this.facing, this.y - 30);
            ctx.stroke();
        }

        // Add to history for trails
        this.history.push({...swordEnd});
        if (this.history.length > 8) this.history.shift();

        // Draw Trails
        if (this.attackType) {
            for (let i = 0; i < this.history.length; i++) {
                ctx.globalAlpha = i / 10;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = i * 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, bodyY);
                ctx.lineTo(this.history[i].x, this.history[i].y);
                ctx.stroke();
            }
        }

        // Draw Main Saber
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "white";
        ctx.lineWidth = 4;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.moveTo(this.x, bodyY);
        ctx.lineTo(swordEnd.x, swordEnd.y);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.y < this.baseY) this.vy += 0.8; 
        else { this.y = this.baseY; this.vy = 0; }

        if (this.timer > 0) this.timer--;
        else this.attackType = null;

        // Keep on screen
        this.x = Math.max(50, Math.min(canvas.width - 50, this.x));
    }

    attack(type) {
        if (!this.attackType) {
            this.attackType = type;
            this.timer = 20;
        }
    }
}

const p1 = new Fighter(200, "#00ffff", true);
const cpu = new Fighter(canvas.width - 200, "#ff0000", false);
const keys = {};

window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

function checkHit(atkr, vctm) {
    if (atkr.attackType && atkr.timer > 10) {
        const dist = Math.abs((atkr.x + (50 * atkr.facing)) - vctm.x);
        if (dist < 60 && Math.abs(atkr.y - vctm.y) < 80) {
            vctm.hp -= 1.5;
            vctm.x += atkr.facing * 5; // knockback
        }
    }
}

function spawnFireworks() {
    for(let i=0; i<80; i++) {
        particles.push({
            x: canvas.width/2, y: canvas.height/3,
            vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
            color: `hsl(${Math.random()*360}, 100%, 60%)`,
            life: 1.0
        });
    }
}

function resetRound() {
    p1.hp = 100; cpu.hp = 100;
    p1.x = 200; cpu.x = canvas.width - 200;
    gameState = "PLAYING";
    msgEl.style.display = "none";
}

function loop() {
    // Clear & Background
    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw Ship Hallway
    ctx.strokeStyle = "#151515";
    ctx.lineWidth = 2;
    for(let i=0; i<canvas.width; i+=100) ctx.strokeRect(i, 0, 100, canvas.height);

    if (gameState === "PLAYING") {
        // Player Input
        p1.vx = keys['ArrowLeft'] ? -5 : keys['ArrowRight'] ? 5 : 0;
        if (keys['ArrowUp'] && p1.y === p1.baseY) p1.vy = -12;
        if (keys['Space']) p1.attack('swing');
        if (keys['ArrowDown']) p1.attack('kick');
        if (keys['KeyT']) p1.attack('thrust');

        // CPU AI
        const dist = p1.x - cpu.x;
        cpu.vx = Math.abs(dist) > 80 ? (dist > 0 ? 3 : -3) : 0;
        if (Math.abs(dist) < 100 && Math.random() > 0.96) cpu.attack('swing');

        p1.update(); cpu.update();
        checkHit(p1, cpu); checkHit(cpu, p1);

        if (p1.hp <= 0 || cpu.hp <= 0) {
            gameState = "END";
            if (p1.hp > 0) p1Wins++; else cpuWins++;
            scoreEl.innerText = `BOUTS: ${p1Wins} - ${cpuWins}`;
            
            if (p1Wins === 2 || cpuWins === 2) {
                msgEl.innerText = p1Wins === 2 ? "JEDI VICTORIOUS" : "SITH TRIUMPHANT";
                if(p1Wins === 2) spawnFireworks();
            } else {
                msgEl.innerText = "ROUND OVER";
                setTimeout(resetRound, 2000);
            }
            msgEl.style.display = "block";
        }
    }

    // Draw Entities
    p1.draw(); cpu.draw();

    // UI
    document.getElementById('p1-hp').style.width = p1.hp + "%";
    document.getElementById('p2-hp').style.width = cpu.hp + "%";

    // Particles
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.02;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 5, 5);
        if (p.life <= 0) particles.splice(i, 1);
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
